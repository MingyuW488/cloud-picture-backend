server:
  port: 8081
  servlet:
    context-path: /api
spring:
  application:
    name: cloud-picture-backend

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/cloud_picture
    username: root
    password: 580226

mybatis-plus:
  configuration:
    map-underscore-tocamel-case: false
    #仅在开发环境打印日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: true
  openapi:
    title: 接口文档
    version: 1.0
    group:
      default:
        group-name:
        api-rule: package
        api-rule-resources:
          - com.yupi.yupicturebackend.controller