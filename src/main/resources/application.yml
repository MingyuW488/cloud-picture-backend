server:
  port: 8081
  servlet:
    context-path: /api
    session:
      cookie:
        max-age: 864000
spring:
  application:
    name: cloud-picture-backend


  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB
      enabled: true
#   #空间图片分表
  shardingsphere:
    datasource:
      names: cloud_picture
      cloud_picture:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: com.mysql.cj.jdbc.Driver
#        本地数据库
        url: jdbc:mysql://localhost:3306/cloud_picture
        username: root

#        服务器数据库
#        url: jdbc:mysql:///cloud_picture
#        username: c-picture-root
        password: 123456
    rules:
      sharding:
        tables:
          picture:
            actual-data-nodes: cloud_picture.picture  # 动态分表
            table-strategy:
              standard:
                sharding-column: spaceId
                sharding-algorithm-name: picture_sharding_algorithm  # 使用自定义分片算法
        sharding-algorithms:
          picture_sharding_algorithm:
            type: CLASS_BASED
            props:
              strategy: standard
              algorithmClassName: com.yupi.yupicturebackend.manager.sharding.PictureShardingAlgorithm
    props:
      sql-show: true
  datasource:
#    服务器数据库
    url: jdbc:mysql://101.42.235.95/cloud_picture
    username: c-picture-root
    driver-class-name: com.mysql.cj.jdbc.Driver
    #本地数据
#    url: jdbc:mysql://localhost:3306/cloud_picture
#    username: root
    password: 123456
  redis:
    port: 6379
    #本地
    host: localhost
    database: 0
    timeout: 5000
    password: 580226
  ##session配置
  session:
    store-type: redis
    timeout: 864000
mybatis-plus:
  configuration:
    map-underscore-tocamel-case: false
    #仅在开发环境打印日志
    log-impl: ''
  global-config:
    enable-sql-runner: true
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

#接口文档
knife4j:
  basic:
    enable: true
    username: root
#    password:
  enable: true
  openapi:
    title: 接口文档
    version: 1.0
    group:
      default:
        group-name:
        api-rule: package
        api-rule-resources:
          - com.yupi.yupicturebackend.controller

